<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una Pregunta Especial 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .emoji {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        h1 {
            color: #764ba2;
            font-size: 28px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .message {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .question {
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
            margin: 30px 0;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 15px 35px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            flex: 1;
            max-width: 150px;
        }

        .btn-yes {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-no {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transition: all 0.3s ease;
            transform-origin: center;
        }
        
        .btn-no.hidden {
            display: none;
        }

        .success-message {
            display: none;
        }

        .success-message.active {
            display: block;
            animation: fadeIn 1s ease-in;
        }

        .hearts {
            font-size: 100px;
            margin: 20px 0;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.2);
            }
            50% {
                transform: scale(1);
            }
        }

        .success-text {
            font-size: 32px;
            color: #764ba2;
            font-weight: bold;
            margin: 20px 0;
        }

        .success-subtitle {
            font-size: 20px;
            color: #667eea;
            margin: 15px 0;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .message {
                font-size: 16px;
            }

            .question {
                font-size: 20px;
            }

            .emoji {
                font-size: 60px;
            }

            button {
                padding: 12px 30px;
                font-size: 16px;
            }

            .hearts {
                font-size: 80px;
            }

            .success-text {
                font-size: 26px;
            }

            .success-subtitle {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="initial-screen">
            <div class="emoji">🌹</div>
            <h1>Hay algo que quiero decirte...</h1>
            <p class="message">
                Eres bonita e increible en todos los sentidos y no puedo dejar de pensar en ti.
                Talvez no es la mejor manera de decirlo, pero...
            </p>
            <div class="question">¿Quieres ser mi novia? 💕</div>
            <div class="buttons">
                <button class="btn-yes" ontouchend="respuestaSi(event)" onclick="respuestaSi(event)">Sí 💖</button>
                <button class="btn-no" id="btnNo" ontouchend="moverBoton(event)" onclick="moverBoton(event)">No</button>
            </div>
        </div>

        <div id="success-screen" class="success-message">
            <div class="hearts">💕</div>
            <div class="success-text">¡Dijiste que sí!</div>
            <div class="success-subtitle">¡Relamente quiero hacerte feliz! ✨</div>
            <p class="message">
                Me gustas mucho ¡Te amo! 💖
            </p>
            <div class="emoji">🥰</div>
        </div>
    </div>

    <script>
        let clickCount = 0;
        
        function moverBoton(event) {
            event.preventDefault();
            event.stopPropagation();
            
            const btn = document.getElementById('btnNo');
            clickCount++;
            
            // Reducir el tamaño cada vez que lo tocan
            const newScale = Math.max(0.1, 1 - (clickCount * 0.15));
            btn.style.transform = `scale(${newScale})`;
            
            // Si es muy pequeño, ocultarlo completamente
            if (clickCount >= 6) {
                btn.classList.add('hidden');
            }
            
            return false;
        }

        function respuestaSi(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            
            document.getElementById('initial-screen').style.display = 'none';
            document.getElementById('success-screen').classList.add('active');
            
            // Crear confeti de corazones
            crearConfeti();
        }

        function crearConfeti() {
            const emojis = ['💕', '💖', '💗', '💝', '❤️', '🌹'];
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const confeti = document.createElement('div');
                    confeti.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    confeti.style.position = 'fixed';
                    confeti.style.left = Math.random() * 100 + '%';
                    confeti.style.top = '-50px';
                    confeti.style.fontSize = '30px';
                    confeti.style.zIndex = '1000';
                    confeti.style.pointerEvents = 'none';
                    confeti.style.animation = `caer ${2 + Math.random() * 2}s linear`;
                    document.body.appendChild(confeti);
                    
                    setTimeout(() => confeti.remove(), 4000);
                }, i * 100);
            }
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes caer {
                to {
                    transform: translateY(100vh) rotate(360deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
